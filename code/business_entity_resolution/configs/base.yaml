# Base config. Paths are relative to the repo root (ml26/). Override per run with a second yaml or CLI flags.
seed: 42
n_folds: 5
subworld_frac: 0.1       # fraction of S1 entities in a closed sub-world (fast loop, CLAUDE.md §6)
max_cands: 50            # per-S1 safety net only: k_per_query per S2/S3 record already bounds S1 lists (~k x 4.68)
decision_margin: 0.0     # extra conservatism in set selection; tuned with LB feedback (test is denser)

blocking:
  k_per_query: 2         # per S2/S3 record, keep its top-k S1s (rank_in_cand <= k)
  min_score: null        # drop pairs with block_score (sum of per-pass normalized scores, 0-3) below this; null/0 = off

decide:
  method: threshold      # threshold | ef05_exact | ef05_approx (v2 only after it wins on real full-world OOF)
  miss_mass: 0.0         # expected true matches per S1 that blocking missed (ef05 methods)
  topk: 15               # candidates per S1 kept for ef05 selection
  threshold: 0.5         # v1 global threshold on calibrated p after one-to-one assignment (tuned on OOF)
  grid: [0.30, 0.95, 0.05]   # start, stop (inclusive), step for the OOF threshold sweep
  scores_name: scores    # which scores artifact decide reads: scores (LightGBM) | scores_fallback

fallback:
  max_train_s1: 300000   # S1s (with all their pairs) per fold model of the fallback scorer

paths:
  data_dir: student_resource/dataset
  train:
    source1: student_resource/dataset/train/train_source1.tsv
    source2: student_resource/dataset/train/train_source2.tsv
    source3: student_resource/dataset/train/train_source3.tsv
    ground_truth: student_resource/dataset/train/train_ground_truth.tsv
  test:
    source1: student_resource/dataset/test/test_source1.tsv
    source2: student_resource/dataset/test/test_source2.tsv
    source3: student_resource/dataset/test/test_source3.tsv
  cache_dir: cache
  output_dir: output
  reports_dir: reports
  validator: student_resource/utils/validate_submission.py
